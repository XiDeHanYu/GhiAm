<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .button-container {
            text-align: center;
        }
        .record-btn {
            background-color: #FF6820;
            color: #FFFFFF;
            width: 100px;
            height: 60px;
            font-size: 22px;
            border: 2px solid #C0C0C0;
            cursor: pointer;
            margin: 5px;
        }
        .record-btn.recording {
            background-color: #009300;
            color: #FFFFFF;
            border: 2px solid #C0C0C0;
        }
        .play-btn {
            background-color: #7D9EC0;
            color: #184008;
            width: 100px;
            height: 60px;
            font-size: 22px;
            border: 2px solid #C0C0C0;
            cursor: pointer;
            margin: 5px;
        }
        .save-btn {
            background-color: #CFE2F3;
            color: #184008;
            width: 100px;
            height: 60px;
            font-size: 22px;
            border: 2px solid #C0C0C0;
            cursor: pointer;
            margin: 5px;
        }
    </style>
    <!-- Thêm thư viện lamejs qua CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body>
    <div class="button-container">
        <button id="record" class="record-btn">录音</button>
        <button id="play" class="play-btn">试听</button>
        <button id="save" class="save-btn">保存</button>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;

        const recordBtn = document.getElementById('record');
        const playBtn = document.getElementById('play');
        const saveBtn = document.getElementById('save');

        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    convertToMp3(audioBlob); // Chuyển đổi sang MP3 sau khi dừng ghi
                    audioChunks = [];
                };
            })
            .catch(err => {
                console.error('Lỗi khi truy cập microphone: ', err);
            });

        recordBtn.addEventListener('click', () => {
            if (mediaRecorder.state === 'inactive') {
                audioChunks = [];
                mediaRecorder.start();
                recordBtn.textContent = '在录';
                recordBtn.classList.add('recording');
            } else if (mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordBtn.textContent = '录音';
                recordBtn.classList.remove('recording');
            }
        });

        playBtn.addEventListener('click', () => {
            if (audioBlob) {
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                audio.play();
            } else {
                alert('Chưa có bản ghi âm nào để phát!');
            }
        });

        // Hàm chuyển đổi WAV sang MP3
        function convertToMp3(blob) {
            const reader = new FileReader();
            reader.onload = function() {
                const arrayBuffer = this.result;
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioContext.decodeAudioData(arrayBuffer, (audioBuffer) => {
                    const wavData = audioBuffer.getChannelData(0); // Lấy dữ liệu kênh trái
                    const mp3Encoder = new lamejs.Mp3Encoder(1, audioBuffer.sampleRate, 128); // 1 kênh, 128kbps
                    const mp3Data = [];
                    const samples = new Int16Array(wavData.length);
                    for (let i = 0; i < wavData.length; i++) {
                        samples[i] = wavData[i] * 32767; // Chuyển đổi sang định dạng 16-bit PCM
                    }
                    const mp3Buffer = mp3Encoder.encodeBuffer(samples);
                    const endBuffer = mp3Encoder.flush();
                    mp3Data.push(mp3Buffer, endBuffer);

                    const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
                    audioBlob = mp3Blob; // Cập nhật audioBlob thành MP3 để phát lại
                    saveBtn.onclick = () => {
                        const audioUrl = URL.createObjectURL(mp3Blob);
                        const a = document.createElement('a');
                        a.href = audioUrl;
                        a.download = 'recording.mp3'; // Lưu dưới dạng .mp3
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    };
                });
            };
            reader.readAsArrayBuffer(blob);
        }
    </script>
</body>
</html>
