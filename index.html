<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 300px;
        }
        .record-btn {
            background-color: #FF6820;
            color: #FFFFFF;
            width: 80px;
            height: 50px;
            font-size: 18px;
            border: 2px solid #C0C0C0;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .record-btn.recording {
            background-color: #009300;
            border: 2px solid #C0C0C0;
        }
        .record-btn:active {
            transform: scale(0.95);
        }
        .play-btn {
            background-color: #7D9EC0;
            color: #184008;
            width: 80px;
            height: 50px;
            font-size: 18px;
            border: 2px solid #C0C0C0;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-btn:active {
            transform: scale(0.95);
        }
        .save-btn {
            background-color: #CFE2F3;
            color: #184008;
            width: 80px;
            height: 50px;
            font-size: 18px;
            border: 2px solid #C0C0C0;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .save-btn:active {
            transform: scale(0.95);
        }
        .text-area {
            width: 100%;
            max-width: 300px;
            min-height: 50px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #C0C0C0;
            border-radius: 8px;
            background-color: #FFFFFF;
            color: #333;
            overflow: hidden;
            resize: none;
            box-sizing: border-box;
        }
        @media (max-width: 600px) {
            .record-btn, .play-btn, .save-btn {
                width: 70px;
                height: 45px;
                font-size: 16px;
            }
            .text-area {
                max-width: 90%;
                font-size: 14px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body>
    <div class="button-container">
        <button id="record" class="record-btn">录音</button>
        <button id="play" class="play-btn">试听</button>
        <button id="save" class="save-btn">保存</button>
    </div>
    <textarea class="text-area" placeholder="Nhập nội dung cần ghi âm ở đây..." oninput="autoResize(this)"></textarea>

    <script>
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = `${textarea.scrollHeight}px`;
        }

        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;

        const recordBtn = document.getElementById('record');
        const playBtn = document.getElementById('play');
        const saveBtn = document.getElementById('save');

        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    convertToMp3(audioBlob);
                    audioChunks = [];
                };
            })
            .catch(err => {
                console.error('Lỗi khi truy cập microphone: ', err);
            });

        recordBtn.addEventListener('click', () => {
            if (mediaRecorder.state === 'inactive') {
                audioChunks = [];
                mediaRecorder.start();
                recordBtn.textContent = '在录';
                recordBtn.classList.add('recording');
            } else if (mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordBtn.textContent = '录音';
                recordBtn.classList.remove('recording');
            }
        });

        playBtn.addEventListener('click', () => {
            if (audioBlob) {
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                audio.play();
            } else {
                alert('Chưa có bản ghi âm nào để phát!');
            }
        });

        function convertToMp3(blob) {
            const reader = new FileReader();
            reader.onload = function() {
                const arrayBuffer = this.result;
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioContext.decodeAudioData(arrayBuffer, (audioBuffer) => {
                    const wavData = audioBuffer.getChannelData(0);
                    const mp3Encoder = new lamejs.Mp3Encoder(1, audioBuffer.sampleRate, 128);
                    const mp3Data = [];
                    const samples = new Int16Array(wavData.length);
                    for (let i = 0; i < wavData.length; i++) {
                        samples[i] = wavData[i] * 32767;
                    }
                    const mp3Buffer = mp3Encoder.encodeBuffer(samples);
                    const endBuffer = mp3Encoder.flush();
                    mp3Data.push(mp3Buffer, endBuffer);

                    const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
                    audioBlob = mp3Blob;
                    saveBtn.onclick = () => {
                        const audioUrl = URL.createObjectURL(mp3Blob);
                        const a = document.createElement('a');
                        a.href = audioUrl;
                        a.download = 'recording.mp3';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    };
                });
            };
            reader.readAsArrayBuffer(blob);
        }

        // Initialize textarea height on page load
        document.querySelector('.text-area').style.height = 'auto';
    </script>
</body>
</html>
